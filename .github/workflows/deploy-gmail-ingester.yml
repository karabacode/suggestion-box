name: Deploy Gmail Ingester

on:
  push:
    branches:
      - main
    paths:
      - 'suggestion-box-processor/gmail-suggestion-ingester/**'
      - '.github/workflows/deploy-gmail-ingester.yml'
      - '.github/workflows/pre-deploy.yml'

permissions:
  contents: read
  id-token: write

jobs:
  call-pre-deploy:
    uses: ./.github/workflows/pre-deploy.yml
    with:
      service_name: gmail-suggestion-ingester
      service_dir: suggestion-box-processor/gmail-suggestion-ingester
      flags: --allow-unauthenticated
      env_vars: |-
        REDIRECT_URI=https://gmail-suggestion-ingester-318780185428.northamerica-northeast1.run.app/v1/auth/callback
        SCOPES=["https://www.googleapis.com/auth/gmail.readonly"]
        PUBSUB_TOPIC=projects/suggestion-box-508020/topics/new-email
        MAINTENANCE_USERNAME=maintenance
        DUPLICATE_SENDER_TTL_SECONDS=60
        IGNORED_GMAIL_LABELS=["SPAM"\,"TRASH"\,"SENT"\,"CATEGORY_PROMOTIONS"\,"CATEGORY_SOCIAL"\,"CATEGORY_UPDATES"\,"CATEGORY_FORUMS"]
      secrets: |-
        CLIENT_SECRET_JSON=google-client-secret:latest
        MAINTENANCE_PASSWORD=maintenance-password:latest
        TOKEN_JSON=gmail-lewis-secret:latest
    secrets: inherit
    